<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Outfit',sans-serif;overflow:hidden}
.post{width:1080px;height:1080px;position:relative;background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 60%,#020617 100%);color:#fff;display:flex;flex-direction:column;padding:70px;overflow:hidden}
.bg-img{position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,23,42,.88),rgba(2,6,23,.96)),url('https://images.unsplash.com/photo-1518562180175-34a163b1a9a6?w=1080') center/cover;opacity:.3}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 60% 70%,rgba(0,210,255,.6),transparent),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,.4),transparent),radial-gradient(2px 2px at 40% 80%,rgba(0,210,255,.3),transparent);background-size:200px 200px}
.glow{position:absolute;top:-100px;right:-100px;width:450px;height:450px;background:radial-gradient(circle,rgba(0,210,255,.15) 0%,transparent 70%)}
.brand{position:relative;display:flex;align-items:center;gap:16px;z-index:2}
.shield{width:54px;height:64px;background:linear-gradient(135deg,#00d2ff,#0284c7);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:26px}
.brand-name{font-size:40px;font-weight:900;letter-spacing:-1px}
.brand-sub{font-size:10px;font-weight:700;letter-spacing:3px;color:#00d2ff;text-transform:uppercase;margin-top:2px}
.satellite{font-size:110px;margin-top:50px;position:relative;z-index:2}
.hook{font-size:50px;font-weight:800;line-height:1.1;margin-top:20px;position:relative;z-index:2;max-width:880px}
.hook .accent{color:#00d2ff}
.hook .strike{text-decoration:line-through;color:#64748b;text-decoration-color:#ef4444}
.benefits{margin-top:auto;position:relative;z-index:2}
.benefit{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;margin-bottom:13px}
.benefit .check{width:38px;height:38px;background:rgba(0,210,255,.15);border:2px solid #00d2ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.footer{margin-top:40px;padding-top:28px;border-top:2px solid rgba(0,210,255,.3);display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.zero-badge{background:#00d2ff;color:#0f172a;padding:12px 26px;border-radius:50px;font-weight:900;font-size:22px;letter-spacing:1px}
.cta{font-size:18px;font-weight:600;color:#94a3b8;text-align:right}
.cta strong{color:#fff;font-size:21px;display:block}
</style></head>
<body><div class="post">
<div class="bg-img"></div><div class="stars"></div><div class="glow"></div>
<div class="brand"><div class="shield">⚡</div><div><div class="brand-name">Router</div><div class="brand-sub">Seguridad Inteligente</div></div></div>
<div class="satellite">🛰️</div>
<div class="hook">"En mi sector no llega internet" <span class="strike">ya no es excusa.</span> <span class="accent">Starlink llega a todos lados.</span></div>
<div class="benefits">
<div class="benefit"><div class="check">✓</div>Internet satelital SpaceX estable 24/7</div>
<div class="benefit"><div class="check">✓</div>Cámaras HD transmitiendo desde el campo</div>
<div class="benefit"><div class="check">✓</div>Ideal para sedes vecinales y fondos GORE</div>
</div>
<div class="footer">
<div class="zero-badge">SECTOR RURAL = POSIBLE</div>
<div class="cta"><strong>+56 9 7858 9090</strong>Arauco · Biobío</div>
</div>
</div></body></html>
